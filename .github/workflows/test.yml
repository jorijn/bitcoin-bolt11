name: CI

on:
  push:
    branches: [ master ]
  pull_request:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
        # "lowest" proves the lower bounds in composer.json actually work;
        # "highest" is what a fresh `composer require` gives a user today.
        # Without a committed lock file, these two are what consumers get.
        dependencies: [ lowest, highest ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gmp, mbstring
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/phpunit --testdox

  spec-known-failures:
    # Official BOLT #11 vectors the library currently gets wrong (see
    # KNOWN_FAILURES in tests/Spec/Bolt11TestVectorsTest.php). These tests are
    # expected to fail, so a plain phpunit run would put a permanent red check
    # on every PR. Instead this job reports the count in the run summary and
    # only fails when a known failure starts passing: then a fix has landed and
    # its vector must move into the gated suite, or it could regress unnoticed.
    name: Spec vectors (known failures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gmp, mbstring
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Run known-failing vectors
        run: |
          # Failing tests are the expected outcome here; the check below decides.
          vendor/bin/phpunit --group spec-known-failure --log-junit known-failures.xml || true
          php -r '
            $suite = simplexml_load_file("known-failures.xml")->testsuite;
            $total = (int) $suite["tests"];
            $failing = (int) $suite["failures"] + (int) $suite["errors"];
            $summary = sprintf("BOLT #11 spec vectors still failing: %d of %d known failures (%d now pass)\n", $failing, $total, $total - $failing);
            file_put_contents(getenv("GITHUB_STEP_SUMMARY"), $summary, FILE_APPEND);
            echo $summary;
            if (0 === $total || $failing < $total) {
                fwrite(STDERR, "::error::A known-failing spec vector now passes (or none ran). Remove it from KNOWN_FAILURES so it is gated.\n");
                exit(1);
            }
          '

  static-analysis:
    name: PHPStan and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # PHPStan targets PHP 7.4 via phpVersion in phpstan.neon.dist, so the
          # runtime here only has to match what contributors use locally, which
          # keeps php-cs-fixer resolving to the same version and output.
          php-version: '8.3'
          extensions: bcmath, gmp, mbstring
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
