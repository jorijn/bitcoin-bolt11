name: CI

on:
  push:
    branches: [ master ]
  pull_request:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    # PHP 8.4+ deprecates implicitly nullable parameters, which src/ still has
    # and which make PHPUnit mark two tests as risky. Until that is fixed in
    # v1.1 these versions report, but do not block.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
        # "lowest" proves the lower bounds in composer.json actually work;
        # "highest" is what a fresh `composer require` gives a user today.
        # Without a committed lock file, these two are what consumers get.
        dependencies: [ lowest, highest ]
        experimental: [ false ]
        include:
          - { php: '8.4', dependencies: lowest, experimental: true }
          - { php: '8.4', dependencies: highest, experimental: true }
          - { php: '8.5', dependencies: lowest, experimental: true }
          - { php: '8.5', dependencies: highest, experimental: true }
          - { php: '8.6', dependencies: lowest, experimental: true }
          - { php: '8.6', dependencies: highest, experimental: true }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gmp, mbstring
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/phpunit --testdox

  spec-known-failures:
    # Official BOLT #11 vectors the library currently gets wrong. Expected to
    # fail until the fixes from the modernisation plan land; it is here so the
    # count stays visible on every PR. Shrinking it is progress.
    name: Spec vectors (known failures, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gmp, mbstring
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit --group spec-known-failure --testdox

  static-analysis:
    name: PHPStan and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # PHPStan targets PHP 7.4 via phpVersion in phpstan.neon.dist, so the
          # runtime here only has to match what contributors use locally, which
          # keeps php-cs-fixer resolving to the same version and output.
          php-version: '8.3'
          extensions: bcmath, gmp, mbstring
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
