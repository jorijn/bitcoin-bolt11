name: CI

on:
  push:
    branches: [ master ]
  pull_request:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5', '8.6' ]
        # "lowest" proves the lower bounds in composer.json actually work;
        # "highest" is what a fresh `composer require` gives a user today.
        # The library has no runtime dependencies, so this only moves the dev
        # tools, but it still catches a PHPUnit lower bound that is too low.
        dependencies: [ lowest, highest ]

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # ext-gmp is the only extension the library needs; installing nothing
          # else keeps CI honest about that.
          extensions: gmp
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Includes all official BOLT #11 test vectors (tests/Spec): every one of
      # them is gated, there is no known-failures list anymore.
      - name: Run tests
        run: vendor/bin/phpunit --testdox

  static-analysis:
    name: PHPStan and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The lowest supported version: PHPStan's phpVersion is 8.3 as well,
          # and php-cs-fixer resolves to the same version contributors get.
          php-version: '8.3'
          extensions: gmp
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
